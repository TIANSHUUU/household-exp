<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家庭食谱</title>
  <link rel="preconnect" href="https://mpvsbeghuueffkjdemcr.supabase.co">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
  <!-- 改了 assets/ 里的文件就把 ?v= 后面的日期序号 bump 一次，否则手机浏览器会一直用缓存的旧版。见 docs/HANDOFF.md 第五节。 -->
  <link rel="stylesheet" href="assets/recipe.css?v=2026080301">
</head>
<body>

<div id="lock-screen">
  <div class="lock-card">
    <div class="lock-icon">🍳</div>
    <div class="lock-title" id="lock-title">家庭食谱</div>
    <div class="lock-sub" id="lock-sub">请输入密码以继续</div>
    <input type="password" class="lock-input" id="lock-input"
           placeholder="••••••••" autocomplete="current-password"
           onkeydown="if(event.key==='Enter')unlock()">
    <div class="lock-error" id="lock-error"></div>
    <button class="lock-btn" id="lock-btn" onclick="unlock()">进入</button>
  </div>
</div>

<div id="app">
  <header class="topbar header-gradient">
    <div class="topbar-inner">
      <h1 id="app-title" onclick="location.hash='#/'">家庭食谱<span class="sync-dot ok" id="sync-dot"></span></h1>
      <div class="topbar-actions">
        <a class="icon-btn" id="nav-expense"  href="index.html">💰 开支</a>
        <a class="icon-btn" id="nav-shopping" href="shopping.html">🛒 购物</a>
        <a class="icon-btn" id="nav-activity" href="activity.html">📅 日程</a>
        <button class="lang-btn" id="lang-btn" onclick="toggleLang()">EN</button>
        <button class="icon-btn" id="nav-lock" onclick="lockApp()">锁定</button>
      </div>
    </div>
  </header>
  <main class="wrap" id="view"></main>
</div>

<div id="lightbox" class="lightbox hidden" onclick="closeLightbox()">
  <img id="lightbox-img" alt="">
</div>

<script src="assets/recipe.js?v=2026080301"></script>
</body>
</html>
