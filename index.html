<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 不要被搜索引擎收录。2026-11-02 去掉登录之后，数据对全网可读可写，
       「没人知道这个网址」是仅剩的一层遮挡，至少别让它被搜出来。
       故意不配 robots.txt：这是项目页，robots.txt 只有在域名根目录才算数，
       而且 Disallow 会让爬虫根本看不到这行 noindex，反而更糟。 -->
  <meta name="robots" content="noindex, nofollow">
  <title>家庭账单</title>
  <link rel="preconnect" href="https://mpvsbeghuueffkjdemcr.supabase.co">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #f2f2f7; --card: #ffffff; --text: #1c1c1e; --sub: #6c6c70;
      --border: #e5e5ea; --accent: #007aff; --green: #34c759;
      --orange: #ff9500; --red: #ff3b30;
      --shadow: 0 1px 8px rgba(0,0,0,0.07), 0 4px 16px rgba(0,0,0,0.04);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000; --card: #1c1c1e; --text: #ffffff; --sub: #8e8e93;
        --border: #2c2c2e;
        --shadow: 0 1px 8px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.2);
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; -webkit-font-smoothing: antialiased;
    }

    /* 和 assets/recipe.css 里的 .lang-btn 同源。index.html 不加载
       recipe.css（它的 CSS 全部内联），所以只能复制一份。两边细节不必
       完全一致——两个页面的配色本来就不同。 */
    .lang-btn {
      padding: 4px 9px; border: 1px solid var(--border); border-radius: 7px;
      background: transparent; color: var(--sub); font-size: 11px; font-weight: 600;
      font-family: inherit; cursor: pointer; transition: background 0.15s, color 0.15s;
    }
    .lang-btn:active { background: var(--card); color: var(--text); }

    /* 拆成两段后 emoji 和文字之间的空格没了，用 margin 补回来。
       放在 .nav-text 上而不是 .nav-icon 上：窄屏隐藏文字时不会留下尾部空隙。 */
    .nav-text { margin-left: 4px; }

    @media (max-width: 520px) {
      .lang-btn { padding: 3px 7px; font-size: 10px; }
      /* 窄屏只留 emoji。做法和 assets/recipe.css 里的一致（那边 2026-08
         就为英文踩过），但这里**中英都生效**，理由是实测出来的：
           · 375px 下 .topbar-inner 只有 335px
           · 中文导航 228px + 新加的语言按钮 32px = 260px，h1 只剩 72px
             而「家庭账单」要 84px —— 缺 12px，标题会被截成「家庭账…」
           · 缩字号（18→16px 省 9px）和压缩按钮（省 6px）都不够，
             而且把按钮做到 9px 字号就太小点不中了
         emoji（☰🛒📅🍳）本身表意清楚，隐藏文字是这里最干净的办法。
         宽屏不受影响，中英文都照常显示完整标签。 */
      .nav-text { display: none; }
      .nav-icon { font-size: 15px; }
    }

    /* ── App ── */
    #app { padding-bottom: 100px; }

    /* ── Loading ── */
    .loading-wrap {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 60px 20px; color: var(--sub); gap: 14px;
    }
    .spinner {
      width: 28px; height: 28px; border: 3px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Topbar ── */
    .topbar {
      position: sticky; top: 0; z-index: 100;
      background: rgba(242,242,247,0.85);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid var(--border); padding: 14px 20px 12px;
    }
    @media (prefers-color-scheme: dark) { .topbar { background: rgba(0,0,0,0.85); } }
    .topbar-inner {
      max-width: 600px; margin: 0 auto;
      display: flex; justify-content: space-between; align-items: center;
    }
    .topbar h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .topbar-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .icon-btn {
      background: none; border: none; cursor: pointer; color: var(--accent);
      font-size: 14px; font-weight: 500; padding: 5px 10px; border-radius: 8px;
      transition: background 0.15s;
    }
    .icon-btn:hover { background: rgba(0,122,255,0.1); }
    @media (max-width: 480px) {
      .icon-btn { padding: 3px 4px; font-size: 12px; }
      .topbar-actions { gap: 2px; }
    }
    .sync-dot {
      display: inline-block; width: 7px; height: 7px; border-radius: 50%;
      margin-left: 6px; vertical-align: middle; transition: background 0.3s;
    }
    .sync-dot.ok   { background: var(--green); }
    .sync-dot.busy { background: var(--orange); animation: pulse 1s infinite; }
    .sync-dot.err  { background: var(--red); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    /* ── Container ── */
    .wrap { max-width: 600px; margin: 0 auto; padding: 16px 16px 0; }

    /* ── Summary ── */
    .summary {
      background: var(--card); border-radius: 18px; padding: 20px;
      margin-bottom: 16px; box-shadow: var(--shadow);
    }
    .summary-cycle {
      font-size: 12px; color: var(--sub); font-weight: 500;
      text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 14px;
    }
    .transfer-hero {
      border-radius: 13px; padding: 16px 20px; text-align: center;
      margin-bottom: 18px; transition: background 0.3s;
    }
    .transfer-hero.pay     { background: linear-gradient(135deg, rgba(0,122,255,0.1),  rgba(0,122,255,0.05)); }
    .transfer-hero.receive { background: linear-gradient(135deg, rgba(52,199,89,0.1),  rgba(52,199,89,0.05)); }
    .transfer-label { font-size: 12px; color: var(--sub); margin-bottom: 4px; }
    .transfer-big { font-size: 40px; font-weight: 700; letter-spacing: -1px; line-height: 1.1; }
    .transfer-big.pay     { color: var(--accent); }
    .transfer-big.receive { color: var(--green); }
    .transfer-big .sym    { font-size: 24px; }
    .transfer-note { font-size: 11px; color: var(--sub); margin-top: 4px; }
    .breakdown { display: flex; flex-direction: column; gap: 9px; }
    .brow { display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
    .brow .lbl { display: flex; align-items: center; gap: 7px; color: var(--sub); }
    .brow .val { font-weight: 500; font-variant-numeric: tabular-nums; }
    .brow .val.positive { color: var(--green); }
    .brow .val.negative { color: var(--red); }
    .brow .val.neutral  { color: var(--text); }
    .bdot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    /* ── Add button ── */
    .add-row { margin-bottom: 16px; }
    .add-main-btn {
      width: 100%; padding: 15px; background: var(--card);
      border: 1.5px dashed rgba(0,122,255,0.45); border-radius: 14px;
      color: var(--accent); font-size: 15px; font-weight: 600; font-family: inherit;
      cursor: pointer; box-shadow: var(--shadow);
      display: flex; align-items: center; justify-content: center; gap: 7px;
      transition: background 0.15s, border-color 0.15s;
    }
    .add-main-btn:hover  { background: rgba(0,122,255,0.05); border-color: var(--accent); }
    .add-main-btn:active { opacity: 0.7; }
    .add-main-btn .plus  { font-size: 20px; line-height: 1; }

    /* ── List ── */
    .date-group { margin-bottom: 14px; }
    .date-label { font-size: 12px; font-weight: 600; color: var(--sub); padding: 0 4px 8px; letter-spacing: 0.2px; }
    .items-card { background: var(--card); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); }
    .item { display: flex; align-items: center; padding: 11px 14px; gap: 11px; }
    .item:not(:last-child) { border-bottom: 1px solid var(--border); }
    .item-dot    { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .item-body   { flex: 1; min-width: 0; }
    .item-desc   { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-tag    { font-size: 11px; color: var(--sub); margin-top: 2px; }
    .item-right  { text-align: right; flex-shrink: 0; }
    .item-amount { font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .item-share  { font-size: 11px; color: var(--sub); margin-top: 2px; }
    .item-actions { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
    .edit-btn {
      background: none; border: none; cursor: pointer; color: var(--sub);
      font-size: 15px; line-height: 1; padding: 4px 6px; border-radius: 6px;
      opacity: 0.4; transition: opacity 0.15s, color 0.15s;
    }
    .edit-btn:hover { opacity: 1; color: var(--accent); }
    .del-btn {
      background: none; border: none; cursor: pointer; color: var(--sub);
      font-size: 20px; line-height: 1; padding: 4px 6px; border-radius: 6px;
      opacity: 0.4; transition: opacity 0.15s, color 0.15s;
    }
    .del-btn:hover { opacity: 1; color: var(--red); }

    /* ── Empty ── */
    .empty { text-align: center; padding: 48px 20px; color: var(--sub); }
    .empty-icon { font-size: 44px; margin-bottom: 12px; }
    .empty-text { font-size: 15px; }

    /* ── FAB ── */
    .fab {
      position: fixed; bottom: 28px; right: 24px;
      width: 58px; height: 58px; border-radius: 50%;
      background: var(--accent); border: none; cursor: pointer;
      color: #fff; font-size: 30px; line-height: 1;
      box-shadow: 0 4px 20px rgba(0,122,255,0.45);
      display: flex; align-items: center; justify-content: center;
      z-index: 200; transition: transform 0.15s, box-shadow 0.15s;
    }
    .fab:active { transform: scale(0.93); box-shadow: 0 2px 10px rgba(0,122,255,0.35); }

    /* ── Sheet ── */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 400;
      display: flex; align-items: flex-end;
      opacity: 0; pointer-events: none; transition: opacity 0.25s;
    }
    .overlay.open { opacity: 1; pointer-events: all; }
    .sheet {
      background: var(--card); border-radius: 20px 20px 0 0;
      padding: 12px 20px 32px; width: 100%; max-width: 600px; margin: 0 auto;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
      max-height: 90vh; overflow-y: auto;
    }
    .overlay.open .sheet { transform: translateY(0); }
    .handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 18px; }
    .sheet-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; }

    /* ── Form ── */
    .fgrp { margin-bottom: 14px; }
    .flabel { display: block; font-size: 12px; font-weight: 600; color: var(--sub); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 7px; }
    .finput {
      width: 100%; padding: 12px 14px; border: 1.5px solid var(--border);
      border-radius: 11px; font-size: 16px; font-family: inherit;
      background: var(--bg); color: var(--text); outline: none; transition: border-color 0.2s;
    }
    .finput:focus { border-color: var(--accent); }
    .seg { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .seg input[type=radio] { display: none; }
    .seg-lbl {
      display: block; padding: 10px 6px 9px; border: 1.5px solid var(--border);
      border-radius: 11px; text-align: center; cursor: pointer;
      font-size: 13px; line-height: 1.35;
      transition: border-color 0.2s, background 0.2s, color 0.2s; user-select: none;
    }
    .seg-lbl small { display: block; font-size: 10px; opacity: 0.65; margin-top: 2px; }
    .seg input[type=radio]:checked + .seg-lbl {
      border-color: var(--accent); background: rgba(0,122,255,0.08);
      color: var(--accent); font-weight: 600;
    }
    .amt-row { display: grid; grid-template-columns: 1fr 120px; gap: 8px; }
    /* 左右内边距压到 4px：最长的选项「RON 罗马尼亚」在 16px 下约 97px，用 .finput
       原本的 14px 内边距只剩 89px 可用，闭合态会被截断。字号保持 16px 不能再小——
       iOS 上 select 字号低于 16px 会在聚焦时把整页放大。 */
    .ccy-select { appearance: none; -webkit-appearance: none; text-align: center; cursor: pointer; padding-left: 4px; padding-right: 4px; }
    .fx-box {
      display: none; margin-top: 8px; padding: 10px 12px;
      background: rgba(0,122,255,0.06); border: 1.5px solid rgba(0,122,255,0.18);
      border-radius: 11px;
    }
    .fx-box.on { display: block; }
    .fx-line { display: flex; align-items: center; gap: 6px; }
    .fx-lbl { font-size: 13px; color: var(--sub); white-space: nowrap; }
    .fx-input {
      flex: 1; min-width: 0; padding: 7px 9px; border: 1.5px solid var(--border);
      border-radius: 8px; font-size: 14px; font-family: inherit;
      background: var(--card); color: var(--text); outline: none;
    }
    .fx-input:focus { border-color: var(--accent); }
    .fx-refresh {
      background: none; border: none; cursor: pointer; color: var(--accent);
      font-size: 16px; padding: 2px 4px; line-height: 1;
    }
    .fx-refresh:disabled { opacity: 0.4; cursor: default; }
    .fx-note { font-size: 11px; color: var(--sub); margin-top: 5px; min-height: 14px; }
    .fx-note.err { color: var(--red); }
    .fx-preview { font-size: 15px; font-weight: 600; margin-top: 3px; }
    .submit {
      width: 100%; padding: 14px; background: var(--accent); color: #fff;
      border: none; border-radius: 13px; font-size: 16px; font-weight: 600;
      font-family: inherit; cursor: pointer; margin-top: 10px; transition: opacity 0.15s;
    }
    .submit:active   { opacity: 0.8; }
    .submit:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Settings ── */
    .srow { display: flex; align-items: center; justify-content: space-between; padding: 13px 0; border-bottom: 1px solid var(--border); }
    .srow:last-of-type { border-bottom: none; }
    .srow-lbl { font-size: 15px; }
    .srow-lbl small { display: block; font-size: 12px; color: var(--sub); margin-top: 2px; }
    .sinput {
      width: 110px; padding: 8px 12px; border: 1.5px solid var(--border);
      border-radius: 9px; font-size: 15px; font-family: inherit; text-align: right;
      background: var(--bg); color: var(--text); outline: none;
    }
    .sinput:focus { border-color: var(--accent); }
    .danger-zone { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }
    .danger-title { font-size: 12px; font-weight: 600; color: var(--sub); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
    .danger-btn {
      width: 100%; padding: 12px; background: rgba(255,59,48,0.1); color: var(--red);
      border: none; border-radius: 11px; font-size: 15px; font-weight: 500;
      font-family: inherit; cursor: pointer;
    }
    .danger-btn:hover { background: rgba(255,59,48,0.18); }

    /* ── Confirm ── */
    .confirm-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 500;
      display: flex; align-items: center; justify-content: center; padding: 20px;
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .confirm-overlay.open { opacity: 1; pointer-events: all; }
    .confirm-box {
      background: var(--card); border-radius: 18px; padding: 28px 22px 22px;
      width: 100%; max-width: 300px; transform: scale(0.88);
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .confirm-overlay.open .confirm-box { transform: scale(1); }
    .confirm-icon  { font-size: 36px; text-align: center; margin-bottom: 10px; }
    .confirm-title { font-size: 17px; font-weight: 700; text-align: center; margin-bottom: 6px; }
    .confirm-desc  { font-size: 14px; color: var(--sub); text-align: center; margin-bottom: 22px; line-height: 1.45; }
    .confirm-btns  { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .cbtn-cancel {
      padding: 13px; background: var(--bg); border: none; border-radius: 12px;
      font-size: 15px; font-weight: 500; font-family: inherit; cursor: pointer; color: var(--text);
    }
    .cbtn-delete {
      padding: 13px; background: rgba(255,59,48,0.12); border: none; border-radius: 12px;
      font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer; color: var(--red);
    }
    .cbtn-delete:hover { background: rgba(255,59,48,0.2); }

    /* ── Undo Toast ── */
    .undo-toast {
      position: fixed; bottom: 104px; left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: #2c2c2e; color: #fff; border-radius: 14px; padding: 12px 16px;
      display: flex; align-items: center; gap: 14px; font-size: 14px; white-space: nowrap;
      z-index: 600; opacity: 0; pointer-events: none;
      transition: opacity 0.22s, transform 0.22s;
      box-shadow: 0 4px 20px rgba(0,0,0,0.35);
    }
    @media (prefers-color-scheme: dark) { .undo-toast { background: #3a3a3c; } }
    .undo-toast.show { opacity: 1; pointer-events: all; transform: translateX(-50%) translateY(0); }
    .undo-text { flex: 1; }
    .undo-btn  { background: none; border: none; cursor: pointer; color: #4da1ff; font-size: 14px; font-weight: 700; font-family: inherit; padding: 0; white-space: nowrap; }

    /* ── Cycle action (settings) ── */
    .cycle-btn {
      width: 100%; padding: 12px; background: rgba(0,122,255,0.1); color: var(--accent);
      border: none; border-radius: 11px; font-size: 15px; font-weight: 600;
      font-family: inherit; cursor: pointer; transition: background 0.15s;
    }
    .cycle-btn:hover { background: rgba(0,122,255,0.18); }
    .cycle-hint { font-size: 12px; color: var(--sub); margin-top: 9px; line-height: 1.5; }

    /* ── Left Drawer (往期记录) ── */
    .drawer-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 400;
      display: flex; opacity: 0; pointer-events: none; transition: opacity 0.25s;
    }
    .drawer-overlay.open { opacity: 1; pointer-events: all; }
    .drawer {
      background: var(--card); width: 84%; max-width: 360px; height: 100%;
      transform: translateX(-100%);
      transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
      display: flex; flex-direction: column; overflow-y: auto;
      box-shadow: 4px 0 24px rgba(0,0,0,0.18);
    }
    .drawer-overlay.open .drawer { transform: translateX(0); }
    .drawer-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 18px 14px; border-bottom: 1px solid var(--border);
      position: sticky; top: 0; background: var(--card); z-index: 1;
    }
    .drawer-title { font-size: 18px; font-weight: 700; }
    .drawer-close { background: none; border: none; font-size: 17px; color: var(--sub); cursor: pointer; padding: 4px 8px; }
    .cyc-item { padding: 15px 18px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.15s; }
    .cyc-item:hover { background: var(--bg); }
    .cyc-range { font-size: 15px; font-weight: 600; }
    .cyc-meta  { font-size: 12px; color: var(--sub); margin-top: 5px; display: flex; justify-content: space-between; align-items: center; }
    .cyc-transfer { font-weight: 700; font-variant-numeric: tabular-nums; }
    .cyc-empty { padding: 48px 24px; text-align: center; color: var(--sub); font-size: 14px; line-height: 1.6; }
  </style>
</head>
<body>

<div id="app">
  <header class="topbar">
    <div class="topbar-inner">
      <h1>家庭账单<span class="sync-dot ok" id="sync-dot"></span></h1>
      <div class="topbar-actions">
        <button class="icon-btn" id="nav-drawer" onclick="openDrawer()">☰ 往期</button>
        <a class="icon-btn" id="nav-shopping" href="shopping.html" style="text-decoration:none;display:inline-block">🛒 购物</a>
        <a class="icon-btn" id="nav-activity" href="activity.html" style="text-decoration:none;display:inline-block">📅 日程</a>
        <a class="icon-btn" id="nav-recipe" href="recipe.html" style="text-decoration:none;display:inline-block">🍳 食谱</a>
        <button class="icon-btn" id="nav-settings" onclick="openSettings()">设置</button>
        <button class="lang-btn" id="lang-btn" onclick="toggleLang()">EN</button>
      </div>
    </div>
  </header>

  <div class="wrap">
    <div class="summary">
      <div class="summary-cycle" id="cycle-label">本期账单</div>
      <div class="transfer-hero pay" id="hero">
        <div class="transfer-label" id="hero-label">本月应转给宝宝</div>
        <div class="transfer-big pay" id="hero-amount"><span class="sym" id="hero-sym">$</span><span id="hero-num">—</span></div>
        <div class="transfer-note" id="hero-note">AUD</div>
      </div>
      <div class="breakdown">

// ── State ──
let expenses     = [];
let activeCycle  = null;   // 当前活跃账期 { id, label, start_date, carryover, ... }
let cfg          = { myRent: 1250, rentDay: 22 };

let pendingDelId = null;
let pendingDelRow = null;

// origCcy 为 null 表示这笔本来就是 AUD 记的（老数据三列全 NULL，不需要迁移）。
// amount 永远是换算后的 AUD——分账、账期结转、往期记录读的都是它，语义不能变。
const toLocal = r => ({
  id: Number(r.id), date: r.date, amount: parseFloat(r.amount),
  desc: r.description, type: r.type,
  origCcy:    r.orig_currency || null,
  origAmount: r.orig_amount == null ? null : parseFloat(r.orig_amount),
  fxRate:     r.fx_rate     == null ? null : parseFloat(r.fx_rate),
});
const toDB = e => ({
  id: e.id, date: e.date, amount: e.amount, description: e.desc, type: e.type,
  cycle_id: activeCycle ? activeCycle.id : null,
  orig_currency: e.origCcy    || null,
  orig_amount:   e.origAmount == null ? null : e.origAmount,
  fx_rate:       e.fxRate     == null ? null : e.fxRate,
});

// ── PURE LOGIC START ──
// 这一段不碰 DOM 也不碰网络。scripts/verify-fx-logic.js 会把它切出来 eval 跑断言，
// 是这个仓库里唯一能自动验证的部分。改这里请保持无副作用，加新函数就顺手加断言。
//
// ⚠️ 非严格模式的直接 eval 里只有 function 声明会跨出 eval 作用域，const/let 不会。
// 所以对外可见的东西一律写成 function；CURRENCIES 是 const，靠 currencyList() 的
// 闭包暴露出去。写成 const currencyList = () => ... 会让验证脚本直接报未定义。

// api.frankfurter.dev 支持的全部 30 种（欧央行口径）。AUD 置顶，后面按旅行常用度排，
// 剩下的按字母序。中文名限 4 字以内——下拉框在手机上只有 120px。
// ⚠️ 这里没有的币种（越南盾、新台币、迪拉姆…）走手填汇率那条路，不要往这个表里加
// 假条目，选中了却拉不到汇率反而更糟。
const CURRENCIES = [
  { code:'AUD', name:'澳元'   }, { code:'JPY', name:'日元'   },
  { code:'KRW', name:'韩元'   }, { code:'THB', name:'泰铢'   },
  { code:'SGD', name:'新元'   }, { code:'MYR', name:'林吉特' },
  { code:'IDR', name:'印尼盾' }, { code:'PHP', name:'比索'   },
  { code:'CNY', name:'人民币' }, { code:'HKD', name:'港币'   },
  { code:'USD', name:'美元'   }, { code:'NZD', name:'纽元'   },
  { code:'EUR', name:'欧元'   }, { code:'GBP', name:'英镑'   },
  { code:'CHF', name:'瑞郎'   }, { code:'CAD', name:'加元'   },
  { code:'BRL', name:'雷亚尔' }, { code:'CZK', name:'捷克'   },
  { code:'DKK', name:'丹麦'   }, { code:'HUF', name:'匈牙利' },
  { code:'ILS', name:'以色列' }, { code:'INR', name:'印度'   },
  { code:'ISK', name:'冰岛'   }, { code:'MXN', name:'墨西哥' },
  { code:'NOK', name:'挪威'   }, { code:'PLN', name:'波兰'   },
  { code:'RON', name:'罗马尼亚' }, { code:'SEK', name:'瑞典' },
  { code:'TRY', name:'土耳其' }, { code:'ZAR', name:'南非'   },
];
function currencyList() { return CURRENCIES.slice(); }

// 原币金额 × 汇率 → AUD，两位小数。任何一个参数不合法都返回 null 而不是 NaN——
// NaN 会一路写进数据库，是最难查的一类脏数据。
function convertToAud(origAmount, rate) {
  const a = Number(origAmount), r = Number(rate);
  if (!isFinite(a) || !isFinite(r) || a <= 0 || r <= 0) return null;
  // 恰好落在半分上的（29 @ 0.005 精确值 0.145）会因浮点表示往下取，差 1 分。
  // 实测这是唯一一类偏差，占比 0.06%，两人分账差 1 分不值得上整数分币的机器。
  return Math.round(a * r * 100) / 100;
}

function fxCacheKey(date, ccy) {
  return String(date) + '|' + String(ccy).toUpperCase();
}

// 原币显示。currencyDisplay 必须是 'code'：narrowSymbol 会把 USD 和 SGD 都渲染成
// $，跟同一行旁边的澳币撞车，而 ¥ 在日元和人民币之间也有歧义。
// ⚠️ ICU 在币种代码和数字之间插的是 U+00A0 不换行空格，不是普通空格。归一成普通
// 空格，输出才在 node 和各浏览器的不同 ICU 版本之间稳定（断言也才好写）。
function fmtOrig(amount, ccy) {
  const a = Number(amount);
  if (!ccy || amount == null || amount === '' || !isFinite(a)) return '';
  try {
    return new Intl.NumberFormat('en-AU',
      { style:'currency', currency: ccy, currencyDisplay:'code' }).format(a)
      .replace(/\u00A0/g, ' ');
  } catch (err) {
    // 只有格式非法的代码（非三个字母，如 'ZZ'）才会走到这——Intl 对 'ZZZ' 这种
    // 三个字母但查无此币的代码并不抛错，会正常渲染成 'ZZZ 100.00'。
    return ccy + ' ' + a;
  }
}

// frankfurter 的响应 → { rate, date } 或 null。date 是它实际给的那天，
// 周末和节假日会回退到上一个工作日。
function parseFxResponse(json) {
  if (!json || !json.rates) return null;
  const rate = json.rates.AUD;
  if (typeof rate !== 'number' || !isFinite(rate) || rate <= 0) return null;
  return { rate: rate, date: json.date || '' };
}

// 汇率取的不是你选的那天就返回真实日期，否则 null。不能闷声换掉——
// 用户后来对流水时会奇怪为什么汇率跟那天的不一样。
function fxNoteDate(requestedDate, actualDate) {
  if (!actualDate || actualDate === requestedDate) return null;
  return actualDate;
}

// 提交前校验。返回 { ok, errorKey }，调用方用 t(errorKey) 取文案。
// 2026-11-12 前这里直接返回中文句子——但这个函数在 PURE LOGIC 段，
// 它不该知道界面说什么语言。
function validateExpenseInput(v) {
  if (!v.date) return { ok:false, errorKey:'errNoDate' };
  if (!v.desc || !String(v.desc).trim()) return { ok:false, errorKey:'errNoDesc' };
  const amt = Number(v.origAmount);
  if (!isFinite(amt) || amt <= 0) return { ok:false, errorKey:'errBadAmount' };
  const c = String(v.ccy || 'AUD').toUpperCase();
  if (c !== 'AUD') {
    const r = Number(v.rate);
    if (!isFinite(r) || r <= 0) return { ok:false, errorKey:'errNoRate' };
  }
  return { ok:true, errorKey:'' };
}

// 15 秒轮询用它判断要不要重渲染。两边（数据库行 / toDB 的输出）都走这一个函数。
// 数字统一过 Number()：PostgREST 可能把 numeric 回成字符串，不归一的话
// "40.00" 和 40 会被当成不同记录，每 15 秒无脑重渲染一次。
// ⚠️ 接进轮询之前必须先让 toDB 也输出这三列，否则每 15 秒无脑重渲染。
function expenseSig(r) {
  const n = x => (x == null || x === '') ? '' : String(Number(x));
  return [r.id, n(r.amount), r.description, r.type, r.date,
          r.orig_currency || '', n(r.orig_amount), n(r.fx_rate)].join(':');
}
// 房租行的 id 用日期派生：'2026-09-22' → 20260922。
//
// 这么做是为了白拿幂等性。现有 id 只有两种来源：手动录入用 Date.now() 的
// 13 位毫秒戳，种子数据是 1–19。8 位的日期 id 和两者都不会撞，所以「补登
// 某个月的房租」重复执行时会直接违反主键约束而失败——**不需要任何「补到
// 哪了」的状态记录**，多设备同时打开也只会成功一个。
//
// 为什么不能用本地水位线：cfg 存在 localStorage（见 loadCfg），是每台设备
// 各一份的，任何基于它的「上次补到哪」在多设备下都会重复补登。
function rentRowId(dateStr) {
  return Number(String(dateStr).slice(0, 10).replace(/-/g, ''));
}

// 判断一笔开支是不是自动生成的房租行。靠 id 的量级区分：
// 房租 8 位（19000101–99991231），种子 1–19，手动录入 13 位。
function isRentRow(e) {
  const id = Number(e && e.id);
  return Number.isInteger(id) && id >= 19000101 && id <= 99991231;
}

// 列出 (afterDate, toDate] 区间内所有的「租金日」，升序。
//
// 左开右闭是刻意的：afterDate 要么是账期起始日（当天及以前属于上一期的
// 结算范围），要么是最后一笔已存在房租行的日期（已经记过了）。两种情况
// 都不能再记一次，所以左端必须排除。
//
// rentDay 超出当月天数时落到当月最后一天：设成 31 的话 2 月记 28/29 号。
// **不能跳过**——跳过的话那个月的租金就永远不进账了。
function rentDatesBetween(afterDate, toDate, rentDay) {
  const day = parseInt(rentDay, 10);
  if (!afterDate || !toDate) return [];
  if (!Number.isInteger(day) || day < 1 || day > 31) return [];

  const a = new Date(afterDate + 'T12:00:00');
  const b = new Date(toDate + 'T12:00:00');
  if (isNaN(a) || isNaN(b) || !(a < b)) return [];

  const out = [];
  let y = a.getFullYear(), m = a.getMonth();
  // 上限 600 个月 = 50 年，纯粹是防死循环的保险丝
  for (let guard = 0; guard < 600; guard++) {
    const lastDay = new Date(y, m + 1, 0).getDate();
    const d = new Date(y, m, Math.min(day, lastDay), 12);
    if (d > b) break;
    if (d > a) {
      out.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`);
    }
    m++;
    if (m > 11) { m = 0; y++; }
  }
  return out;
}

// 从开支列表和上期结余算出本期各项。抽成纯函数是为了能在
// scripts/verify-fx-logic.js 里断言——这是全仓库唯一直接决定钱的公式，
// 2026-11-02 之前它一条断言都没有。
//
// ⚠️ **公式里没有租金项，这是刻意的。** 2026-11-02 起租金是一条真实的
// partner_paid 开支（每月自动补登，见 ensureRentRows），已经包含在 cp 里。
// 再加一次 cfg.myRent 就是双重计算。
//
// 旧公式是 carryover + cfg.myRent - shared/2 - pp + cp，那个 myRent 按
// 「每个活跃账期一次」计，不是按月——账期跑了 2.3 个月也只加一笔，
// 把宝宝欠款多算了 1250 且每月增长。详见 HANDOFF 第十三节。
function calcTotals(rows, carryover) {
  let shared = 0, pp = 0, cp = 0;
  (rows || []).forEach(e => {
    const amt = parseFloat(e && e.amount) || 0;
    if      (e.type === 'shared')           shared += amt;
    else if (e.type === 'partner_personal') pp     += amt;
    else if (e.type === 'partner_paid')     cp     += amt;
  });
  const carry = parseFloat(carryover) || 0;
  return { shared, pp, cp, carryover: carry, transfer: carry - shared / 2 - pp + cp };
}

// 货币下拉框一个选项的显示文字。
// 英文只给代码：下拉框宽度就那么点（见上面 CURRENCIES 那段关于 97px 的
// 计算），英文全名塞不下；而代码本身就是国际通用写法。
function currencyOptionLabel(c, lng) {
  if (!c || !c.code) return '';
  if (lng === 'en' || !c.name) return c.code;
  return c.code + ' ' + c.name;
}

// 日期显示。抽成纯函数是为了能断言——星期下标从 0=周日 开始，
// 差一位的 bug 在界面上就是「周四显示成周三」，不盯着根本发现不了。
//
// 用 T12:00:00 而不是 T00:00:00：澳洲是 UTC+10/+11，用 00:00 构造的话
// new Date 在某些时区会退回前一天。这个写法是从原来的 fmtDate 抄过来的，
// 不要「顺手优化」掉。
function fmtDateIn(ds, lng) {
  const d = new Date(ds + 'T12:00:00');
  if (lng === 'en') {
    const mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const wk = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    return `${mo[d.getMonth()]} ${d.getDate()} · ${wk[d.getDay()]}`;
  }
  const mo = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  const wk = ['周日','周一','周二','周三','周四','周五','周六'];
  return `${mo[d.getMonth()]}${d.getDate()}日 · ${wk[d.getDay()]}`;
}

// 英文版汇总卡的数值视角。中文版不用它。
//
// 中文版从「要转多少钱」的角度算：transfer = carry - shared/2 - pp + cp，
// 负数表示宝宝欠你，界面上用标签表达方向、金额取绝对值。
//
// 英文版从 Tianshu 的角度算，约定「正数 = Tianshu 是债权方」，所以每一项
// 都是中文那项的相反数。**整张卡必须一起翻**，只翻 hero 的话明细加起来
// 对不上 hero —— 在算钱的页面上这是硬伤。
//
//   -carry + shared/2 + pp - cp === -(carry - shared/2 - pp + cp) === -transfer
function balanceView(v) {
  const num = x => parseFloat(x) || 0;
  const carry     = -num(v && v.carryover);
  const halfShare =  num(v && v.shared) / 2;
  const pp        =  num(v && v.pp);
  const cp        = -num(v && v.cp);
  return { carry, halfShare, pp, cp, balance: carry + halfShare + pp + cp };
}

// ── FX rates ──
// ⚠️ 这是第三方 API，不是 Supabase。**绝对不要给它带 await H()**——
// 那会把登录令牌泄露给 frankfurter.dev。整个仓库只有这一处 fetch 不带 H()。
const FX_API   = 'https://api.frankfurter.dev/v1';   // 旧域名 .app 现在 301 跳转，别用
const FX_CACHE = 'hh_fx';
const CCY_KEY  = 'hh_last_ccy';

function fxCacheRead() {
  try { return JSON.parse(localStorage.getItem(FX_CACHE) || '{}'); } catch (e) { return {}; }
}
// 历史汇率不可变，所以缓存零风险、只增不删。一年几百个 key、几 KB，不用做淘汰。
function fxCacheGet(date, ccy) {
  const v = fxCacheRead()[fxCacheKey(date, ccy)];
  return typeof v === 'number' ? v : null;
}
function fxCacheSet(date, ccy, rate) {
  const c = fxCacheRead();
  c[fxCacheKey(date, ccy)] = rate;
  try { localStorage.setItem(FX_CACHE, JSON.stringify(c)); } catch (e) {}
}

// 返回 { rate, date } 或 null。date 是 API 实际给的那天。
async function fetchRate(date, ccy) {
  const r = await fetch(`${FX_API}/${date}?base=${encodeURIComponent(ccy)}&symbols=AUD`);
  if (!r.ok) throw new Error('fx ' + r.status);
  return parseFxResponse(await r.json());
}

// 上次用的货币。存的值可能是老版本留下的、现在不在表里的代码，所以要校验。
function lastCcy() {
  const c = localStorage.getItem(CCY_KEY);
  return currencyList().some(x => x.code === c) ? c : 'AUD';
}

function fillCurrencySelect() {
  document.getElementById('f-ccy').innerHTML =
    currencyList().map(c => `<option value="${c.code}">${currencyOptionLabel(c, lang)}</option>`).join('');
}

// 慢请求可能在新请求之后才返回，会把新结果覆盖掉。每次发请求递增 fxSeq，
// 回来时对不上就丢弃。旅行时快速连点几个币种一定会撞上。
let fxSeq = 0;

function curCcy()  { return document.getElementById('f-ccy').value; }
function curRate() { return parseFloat(document.getElementById('f-rate').value); }

function setFxNote(text, isErr) {
  const el = document.getElementById('fx-note');
  el.textContent = text || '';
  el.classList.toggle('err', !!isErr);
}

// 展开/收起汇率行，返回当前是不是外币。
function syncFxBox() {
  const ccy = curCcy();
  const on  = !!ccy && ccy !== 'AUD';
  document.getElementById('fx-box').classList.toggle('on', on);
  document.getElementById('fx-ccy').textContent = ccy || '—';
  return on;
}

function updateFxPreview() {
  const amt = parseFloat(document.getElementById('f-amount').value);
  const aud = convertToAud(amt, curRate());
  document.getElementById('fx-preview').textContent =
    aud == null ? '≈ A$—' : `≈ A$${fmt(aud)}`;
}

// force = true 时跳过缓存重拉（↻ 按钮用）。
async function loadRate(force) {
  if (!syncFxBox()) { setFxNote(''); return; }
  const date = document.getElementById('f-date').value;
  const ccy  = curCcy();
  if (!date) return;

  const cached = force ? null : fxCacheGet(date, ccy);
  if (cached != null) {
    document.getElementById('f-rate').value = cached;
    setFxNote(''); updateFxPreview(); return;
  }

  const seq = ++fxSeq;
  const btn = document.getElementById('fx-refresh');
  btn.disabled = true;
  setFxNote(t('fxLoading'));
  try {
    const res = await fetchRate(date, ccy);
    if (seq !== fxSeq) return;
    if (!res) throw new Error('no rate');
    fxCacheSet(date, ccy, res.rate);
    document.getElementById('f-rate').value = res.rate;
    const noteDate = fxNoteDate(date, res.date);
    // 不能写「当天休市」。欧央行每天欧洲时间下午才发当日牌价，澳洲白天记当天的账时
    // 那边还是前一晚——最常见的场景根本没休市，只是牌价还没出。这句话要同时说得通。
    setFxNote(noteDate ? t('fxNote', noteDate) : '');
  } catch (err) {
    if (seq !== fxSeq) return;
    console.error(err);
    document.getElementById('f-rate').value = '';
    setFxNote(t('fxNoRate', ccy), true);
  } finally {
    // finally 在提前 return 时也会跑，但只有最新那次请求才该动 UI
    if (seq === fxSeq) { btn.disabled = false; updateFxPreview(); }
  }
}

// ── Sync dot ──

// ── Init ──
async function initApp() {

function showLoading(on) {

    document.getElementById('empty').style.display = 'none';

// 把「最后一笔房租行」到今天之间漏掉的房租补上。页面加载时调一次。
//
// 水位线取**已有房租行里最晚的那天**，没有才退回账期起始日。不能只看
// start_date：以后要是把租金日从 22 改成 25，就会去扫每月 25 号，而那个月
// 22 号已经有一笔了——同一个月记两次租金。
//
// 逐笔插入而不是批量：PostgREST 的批量插入是原子的，只要有一笔撞上主键
// （另一台设备刚补过），整批都会失败，于是永远补不进去。逐笔插入时失败的
// 那笔跳过，其余照常。
async function ensureRentRows() {
  if (!activeCycle || !activeCycle.start_date) return;
  const today = new Date().toISOString().split('T')[0];
  const rentDates = expenses.filter(isRentRow).map(e => e.date).sort();
  const after = rentDates.length ? rentDates[rentDates.length - 1] : activeCycle.start_date;
  const due = rentDatesBetween(after, today, cfg.rentDay);
  if (!due.length) return;

  for (const d of due) {
    try {
      const [row] = await dbInsert({
        id: rentRowId(d), date: d, amount: cfg.myRent,
        description: '房租', type: 'partner_paid', cycle_id: activeCycle.id,
      });
      expenses.push(toLocal(row));
    } catch (e) {
      // 主键冲突 = 另一台设备刚补过这个月，是正常情况不是错误
      console.warn('房租补登跳过', d, e.message);
    }
  }
  expenses.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : a.id - b.id));
}

async function loadExpenses() {
  setSyncDot('busy');
  try {
    activeCycle = await dbGetActiveCycle();
    cfgFromCycle(activeCycle);
    if (!activeCycle) {
      // 全新数据库：引导建立首期账期并写入种子数据
      activeCycle = await dbInsertCycle({ label: '首期账单', start_date: SEED[0].date, status: 'active', carryover: 0 });
      const seeded = SEED.map(s => ({ ...s, cycle_id: activeCycle.id }));
      const inserted = await dbInsert(seeded);
      expenses = inserted.map(toLocal);
    } else {
      const data = await dbGet(activeCycle.id);
      expenses = data.map(toLocal);
    }
    // 必须放在 expenses 填好之后——要读已有房租行来定水位线
    await ensureRentRows();
    setSyncDot('ok');
    render();
  } catch(e) {
    console.error(e);
    setSyncDot('err');
  }
}

// Poll every 15s — follow the active cycle, only re-render on change
function startPolling() {
  setInterval(async () => {
    if (document.visibilityState !== 'visible') return;
    try {
      const ac = await dbGetActiveCycle();
      if (!ac) { setSyncDot('err'); return; }
      const cycleChanged = !activeCycle || ac.id !== activeCycle.id
        || parseFloat(ac.carryover || 0) !== parseFloat(activeCycle.carryover || 0);
      activeCycle = ac;
      const data = await dbGet(ac.id);
      const sig = d => d.map(expenseSig).join('|');
      if (cycleChanged || sig(data) !== sig(expenses.map(toDB))) {
        expenses = data.map(toLocal);
        render();
      }
      setSyncDot('ok');
    } catch(e) { setSyncDot('err'); }
  }, 15000);
}

// ── Config ──
function loadCfg() {
  const raw = localStorage.getItem(SET_KEY);
  if (raw) cfg = { ...cfg, ...JSON.parse(raw) };
}
function saveCfg() { localStorage.setItem(SET_KEY, JSON.stringify(cfg)); }

// 租金配置以数据库为准，localStorage 只是没读到时的兜底。
//
// 为什么必须搬进数据库：cfg 存在 localStorage，是**每台设备各一份的**。
// 租金从「显示用的公式参数」变成「写进数据库的真实金额」之后，两边不一致
// 就会出事——同一个月的租金记成多少，取决于谁先打开网页，而且因为房租行
// 的 id 按日期派生（幂等），先写的那个值会永久固定下来。
function cfgFromCycle(c) {
  if (!c) return;
  if (c.rent_amount != null) cfg.myRent  = parseFloat(c.rent_amount);
  if (c.rent_day    != null) cfg.rentDay = parseInt(c.rent_day, 10);
  saveCfg();   // 同步一份到 localStorage，纯粹是下次打开时的首屏兜底
}

// ── Calc ──
// 数学在 PURE LOGIC 段的 calcTotals 里，这里只负责把全局状态喂进去。
function calc() {
  return calcTotals(expenses, activeCycle ? activeCycle.carryover : 0);
}

// ── Format ──
const fmt = n => Math.abs(n).toLocaleString('en-AU', { minimumFractionDigits:2, maximumFractionDigits:2 });
// 薄封装，真正的逻辑在 PURE LOGIC 段的 fmtDateIn 里（那边能被断言）
function fmtDate(ds) { return fmtDateIn(ds, lang); }

// ── Render ──
function renderSummary() {
  const { shared, pp, cp, carryover, transfer } = calc();
  const recv = transfer < 0;                 // 宝宝欠你
  const en   = lang === 'en';
  // 英文版从 Tianshu 视角看，每一项都是中文那项的相反数（见 PURE LOGIC
  // 段的 balanceView 注释）。**颜色不用翻**：中文的 -$567.60 和英文的
  // +$567.61 都表示「对你有利」，class 语义本来就是「对 TS 好 = 绿」。
  const bv = en ? balanceView({ carryover, shared, pp, cp }) : null;

  document.getElementById('hero').className         = 'transfer-hero ' + (recv ? 'receive' : 'pay');
  document.getElementById('hero-amount').className  = 'transfer-big '  + (recv ? 'receive' : 'pay');
  document.getElementById('hero-label').textContent = recv ? t('heroRecv') : t('heroPay');
  if (en) {
    document.getElementById('hero-sym').textContent = (bv.balance < 0 ? '-$' : '+$');
    document.getElementById('hero-num').textContent = fmt(bv.balance);
  } else {
    document.getElementById('hero-sym').textContent = '$';
    document.getElementById('hero-num').textContent = fmt(transfer);
  }
  document.getElementById('hero-note').textContent   = t('heroNote', cfg.rentDay);
  document.getElementById('cycle-label').textContent = t('cycleLabel', expenses.length);

  const carryRow = document.getElementById('b-carry-row');
  if (Math.abs(carryover) >= 0.005) {
    carryRow.style.display = 'flex';
    document.getElementById('b-carry-lbl').textContent = carryover < 0 ? t('bCarryRecv') : t('bCarryPay');
    const cv = document.getElementById('b-carry');
    const cVal = en ? bv.carry : carryover;
    cv.textContent = (cVal < 0 ? '-$' : '+$') + fmt(cVal);
    cv.className   = 'val ' + (carryover < 0 ? 'positive' : 'negative');
  } else {
    carryRow.style.display = 'none';
  }

  document.getElementById('b-shared-total').textContent = `$${fmt(shared)}`;
  document.getElementById('b-shared-half').textContent  = (en ? '+$' : '-$') + fmt(shared / 2);
  document.getElementById('b-partner-paid').textContent = pp > 0 ? (en ? '+$' : '-$') + fmt(pp) : '$0.00';
  document.getElementById('b-covered').textContent      = cp > 0 ? (en ? '-$' : '+$') + fmt(cp) : '$0.00';
}

const TYPE_META = {
  shared:           { dot:'var(--green)',  tagKey:'typeShared'          },
  partner_personal: { dot:'var(--orange)', tagKey:'typePartnerPersonal' },
  partner_paid:     { dot:'var(--red)',    tagKey:'typePartnerPaid'     },
};
function itemRowHtml(e, readonly) {
  const meta = TYPE_META[e.type];   // 不能叫 t —— 会遮蔽全局的 t() 词条函数
  const amtTxt   = e.type === 'partner_paid' ? `−$${fmt(e.amount)}` : `$${fmt(e.amount)}`;
  const shareTxt = e.type === 'shared' ? t('shareEach', fmt(e.amount/2))
                 : e.type === 'partner_personal' ? t('shareFullCredit')
                 : t('shareFullCharge');
  // 只有外币记录才多这一段。AUD 记的行显示和以前一模一样。
  const origTxt  = e.origCcy ? fmtOrig(e.origAmount, e.origCcy) : '';
  const subTxt   = origTxt ? `${origTxt} · ${shareTxt}` : shareTxt;
  // 房租行不给删除按钮：删掉之后下次加载会发现那个 id 不存在，于是
  // ensureRentRows 又补回来——一行删不掉的鬼行。改金额没问题，编辑保留
  // 原 id，不会触发补登。真要去掉某个月的房租就把金额改成 0。
  const actions  = readonly ? '' : `<div class="item-actions">
          <button class="edit-btn" onclick="openEdit(${e.id})" title="${t('btnEdit')}">✎</button>
          ${isRentRow(e) ? '' : `<button class="del-btn"  onclick="askDel(${e.id})"  title="${t('btnDelete')}">×</button>`}
        </div>`;
  return `<div class="item">
        <span class="item-dot" style="background:${meta.dot}"></span>
        <div class="item-body">
          <div class="item-desc">${escHtml(e.desc)}</div>
          <div class="item-tag">${t(meta.tagKey)}</div>
        </div>
        <div class="item-right">
          <div class="item-amount">${amtTxt}</div>
          <div class="item-share">${subTxt}</div>
        </div>${actions}
      </div>`;
}
function groupedListHtml(exps, readonly) {
  const map = {};
  exps.forEach(e => { (map[e.date] = map[e.date] || []).push(e); });
  const dates = Object.keys(map).sort((a,b) => b < a ? -1 : 1);
  return dates.map(date =>
    `<div class="date-group"><div class="date-label">${fmtDate(date)}</div><div class="items-card">${map[date].map(e => itemRowHtml(e, readonly)).join('')}</div></div>`
  ).join('');
}

function renderList() {
  const listEl  = document.getElementById('list');
  const emptyEl = document.getElementById('empty');
  if (expenses.length === 0) { listEl.innerHTML = ''; emptyEl.style.display = 'block'; return; }
  emptyEl.style.display = 'none';
  listEl.innerHTML = groupedListHtml(expenses, false);
}

// ── Add / Edit ──
function openAdd() {
  editingId = null;
  document.getElementById('f-date').value   = new Date().toISOString().split('T')[0];
  document.getElementById('f-amount').value = '';
  document.getElementById('f-desc').value   = '';
  document.getElementById('ft-shared').checked = true;
  // 记住上次用的货币：旅行中连记 20 笔不用每次切。代价是回国后第一笔 AUD
  // 容易忘了切回去——防线是汇率行的底色和实时的「≈ A$」数字。
  // 用户明确接受这个取舍，别自作主张改成「隔天自动重置」之类的聪明逻辑。
  document.getElementById('f-ccy').value  = lastCcy();
  document.getElementById('f-rate').value = '';
  setFxNote('');
  document.getElementById('add-sheet-title').textContent = t('addTitle');
  document.getElementById('add-submit-btn').textContent  = t('btnAdd');
  document.getElementById('add-overlay').classList.add('open');
  loadRate(false);
  setTimeout(() => document.getElementById('f-amount').focus(), 350);
}
function openEdit(id) {
  const e = expenses.find(x => x.id === id);
  if (!e) return;
  editingId = id;
  document.getElementById('f-date').value   = e.date;
  document.getElementById('f-ccy').value    = e.origCcy || 'AUD';
  // 外币记录回填的是原币金额，不是换算后的 AUD
  document.getElementById('f-amount').value = e.origCcy ? e.origAmount : e.amount;
  document.getElementById('f-rate').value   = e.origCcy ? e.fxRate : '';
  document.getElementById('f-desc').value   = e.desc;
  document.querySelector(`input[name="ftype"][value="${e.type}"]`).checked = true;
  setFxNote('');
  // 只开合面板，**不重新拉汇率**——那笔账当时用的就是存下来的这个，
  // 重拉会无声改掉已经记好的账。改了日期或货币才会触发重拉。
  syncFxBox();
  updateFxPreview();
  document.getElementById('add-sheet-title').textContent = t('editTitle');
  document.getElementById('add-submit-btn').textContent  = t('btnSaveEdit');
  document.getElementById('add-overlay').classList.add('open');
  setTimeout(() => document.getElementById('f-amount').focus(), 350);
}
function closeAdd() { editingId = null; document.getElementById('add-overlay').classList.remove('open'); }

async function submitExpense() {
  const date  = document.getElementById('f-date').value;
  const desc  = document.getElementById('f-desc').value.trim();
  const type  = document.querySelector('input[name="ftype"]:checked').value;
  const ccy   = curCcy();
  const inAmt = parseFloat(document.getElementById('f-amount').value);
  const rate  = ccy === 'AUD' ? 1 : curRate();

  const v = validateExpenseInput({ date, desc, origAmount: inAmt, ccy, rate });
  if (!v.ok) { alert(t(v.errorKey)); return; }

  // amount 永远是 AUD。origCcy 为 null 表示这笔本来就是 AUD 记的。
  const amount     = ccy === 'AUD' ? inAmt : convertToAud(inAmt, rate);
  const origCcy    = ccy === 'AUD' ? null  : ccy;
  const origAmount = ccy === 'AUD' ? null  : inAmt;
  const fxRate     = ccy === 'AUD' ? null  : rate;
  // 校验已经拦过一层，这里是最后一道闸——NaN 写进数据库比报错难查得多
  if (amount == null || amount <= 0) { alert(t('errConvert')); return; }

  const row = { date, amount, description: desc, type,
                orig_currency: origCcy, orig_amount: origAmount, fx_rate: fxRate };

  const btn = document.getElementById('add-submit-btn');
  btn.disabled = true; setSyncDot('busy');
  try {
    if (editingId !== null) {
      await dbUpdate(editingId, row);
      const idx = expenses.findIndex(x => x.id === editingId);
      if (idx !== -1) expenses[idx] = { id: editingId, date, amount, desc, type, origCcy, origAmount, fxRate };
    } else {
      const newId = Date.now();
      await dbInsert({ id: newId, ...row, cycle_id: activeCycle ? activeCycle.id : null });
      expenses.push({ id: newId, date, amount, desc, type, origCcy, origAmount, fxRate });
    }
    setSyncDot('ok'); render(); closeAdd();
  } catch(e) { console.error(e); setSyncDot('err'); }
  btn.disabled = false;
}

// ── Delete ──
function askDel(id) {
  const e = expenses.find(x => x.id === id);
  if (!e) return;
  pendingDelId = id;
  document.getElementById('confirm-desc').textContent = `「${e.desc}」$${fmt(e.amount)}`;
  document.getElementById('confirm-overlay').classList.add('open');
}
function cancelDel() { pendingDelId = null; document.getElementById('confirm-overlay').classList.remove('open'); }

async function confirmDel() {
  const e = expenses.find(x => x.id === pendingDelId);
  if (!e) { cancelDel(); return; }
  pendingDelRow = toDB(e);
  setSyncDot('busy');
  try {
    await dbDelete(pendingDelId);
    expenses = expenses.filter(x => x.id !== pendingDelId);
    pendingDelId = null;
    setSyncDot('ok'); render();
    document.getElementById('confirm-overlay').classList.remove('open');
    showUndoToast(e.desc);
  } catch(err) { console.error(err); setSyncDot('err'); }
}

async function undoDel() {
  if (!pendingDelRow) return;
  setSyncDot('busy');
  try {
    await dbInsert(pendingDelRow);
    expenses.push(toLocal(pendingDelRow));
    expenses.sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.id - b.id);
    pendingDelRow = null;
    setSyncDot('ok'); render(); hideUndoToast();
  } catch(e) { console.error(e); setSyncDot('err'); }
}

function showUndoToast(desc) {
  clearTimeout(undoTimer);
  document.getElementById('undo-text').textContent = t('undoDeleted', desc);
  document.getElementById('undo-toast').classList.add('show');
  // 30 秒不是 5 秒——5 秒真的会错过（2026-08-04 实测就没看到）。
  //
  // 2026-11-02 之前这里还有第二个理由：pendingDelRow 冻着删除那一刻的
  // cycle_id，而归档时不清它，撤销窗口太长就可能把一笔账插回已经结算完的
  // 账期。归档功能删掉之后只剩一个永远活跃的账期，这个风险没有了。
  // 但仍然别改成常驻——一个永不消失的浮层挡着内容就是烦人。
  undoTimer = setTimeout(hideUndoToast, 30000);
}
function hideUndoToast() { clearTimeout(undoTimer); document.getElementById('undo-toast').classList.remove('show'); }

// ── Settings ──
function openSettings() {
  document.getElementById('s-myrent').value  = cfg.myRent;
  document.getElementById('s-rentday').value = cfg.rentDay;
  document.getElementById('rent-hint').textContent = t('rentHint', cfg.rentDay);
  document.getElementById('set-overlay').classList.add('open');
}
async function saveSettings() {
  const myRent  = parseFloat(document.getElementById('s-myrent').value);
  const rentDay = parseInt(document.getElementById('s-rentday').value);
  if (!myRent || !rentDay || rentDay < 1 || rentDay > 31) { alert(t('errBadSettings')); return; }
  if (!activeCycle) { alert(t('errNoCycle')); return; }
  setSyncDot('busy');
  try {
    // 写数据库而不是只写 localStorage——两人两台设备必须看到同一个租金
    await dbUpdateCycle(activeCycle.id, { rent_amount: myRent, rent_day: rentDay });
    activeCycle.rent_amount = myRent;
    activeCycle.rent_day    = rentDay;
    cfg = { myRent, rentDay }; saveCfg();
    setSyncDot('ok');
    render();
    document.getElementById('set-overlay').classList.remove('open');
  } catch (e) { console.error(e); setSyncDot('err'); alert(t('errSaveFailed')); }
}
function fmtShort(ds) {
  if (!ds) return '';
  const d = new Date(ds + 'T12:00:00');
  return `${d.getMonth() + 1}/${d.getDate()}`;
}
function cycRange(c) {
  return `${fmtShort(c.start_date) || '—'} – ${c.end_date ? fmtShort(c.end_date) : t('cycToNow')}`;
}

// ── 历史账期详情（只读）──
async function openHistory(cycleId) {
  document.getElementById('hist-overlay').classList.add('open');
  const body = document.getElementById('hist-body');
  body.innerHTML = `<div class="loading-wrap"><div class="spinner"></div><span>${t('loading')}</span></div>`;
  try {
    const [rows, cycles] = await Promise.all([ dbGet(cycleId), dbGetArchivedCycles() ]);
    const cyc  = cycles.find(c => c.id === cycleId);
    const exps = rows.map(toLocal);
    document.getElementById('hist-title').textContent = cyc ? cycRange(cyc) : t('histTitle');
    body.innerHTML = historySummaryHtml(cyc, exps) +
      (exps.length ? groupedListHtml(exps, true) : `<div class="cyc-empty">${t('histEmpty')}</div>`);
  } catch(e) { console.error(e); body.innerHTML = `<div class="cyc-empty">${t('loadFailed')}</div>`; }
}
function historySummaryHtml(cyc, exps) {
  let shared = 0, pp = 0, cp = 0;
  exps.forEach(e => {
    if      (e.type === 'shared')           shared += e.amount;
    else if (e.type === 'partner_personal') pp     += e.amount;
    else if (e.type === 'partner_paid')     cp     += e.amount;
  });
  const carry    = cyc ? parseFloat(cyc.carryover || 0) : 0;
  const transfer = cyc && cyc.transfer != null ? parseFloat(cyc.transfer) : (carry + cfg.myRent - shared/2 - pp + cp);
  const rentUsed = transfer - carry + shared/2 + pp - cp;   // 还原归档时的租金份额，保证明细与结算额自洽
  const recv = transfer < 0;
  const carryRow = Math.abs(carry) >= 0.005
    ? `<div class="brow"><span class="lbl"><span class="bdot" style="background:var(--sub)"></span>${carry < 0 ? t('bCarryRecv') : t('bCarryPay')}</span><span class="val ${carry < 0 ? 'positive' : 'negative'}">${carry < 0 ? '-$' : '+$'}${fmt(carry)}</span></div>`
    : '';
  return `<div class="summary" style="margin:0 0 14px">
    <div class="transfer-hero ${recv ? 'receive' : 'pay'}">
      <div class="transfer-label">${recv ? t('histRecv') : t('histPay')}</div>
      <div class="transfer-big ${recv ? 'receive' : 'pay'}"><span class="sym">$</span>${fmt(transfer)}</div>
      <div class="transfer-note">${t('histSettled')}</div>
    </div>
    <div class="breakdown">
      ${carryRow}
      <div class="brow"><span class="lbl"><span class="bdot" style="background:var(--accent)"></span>${t('histRent')}</span><span class="val neutral">$${fmt(rentUsed)}</span></div>
      <div class="brow"><span class="lbl"><span class="bdot" style="background:var(--green)"></span>${t('bSharedTotal')}</span><span class="val neutral">$${fmt(shared)}</span></div>
      <div class="brow" style="padding-left:15px"><span class="lbl">${t('bSharedHalf')}</span><span class="val positive">-$${fmt(shared/2)}</span></div>
      <div class="brow"><span class="lbl"><span class="bdot" style="background:var(--orange)"></span>${t('bPartnerPaid')}</span><span class="val positive">${pp > 0 ? '-$' + fmt(pp) : '$0.00'}</span></div>
      <div class="brow"><span class="lbl"><span class="bdot" style="background:var(--red)"></span>${t('bCovered')}</span><span class="val negative">${cp > 0 ? '+$' + fmt(cp) : '$0.00'}</span></div>
    </div>
  </div>`;
}

function overlayClick(e, id) {
  if (e.target.classList.contains('overlay')) document.getElementById(id).classList.remove('open');
}
function overlayClick2(e, id) {
  if (e.target.classList.contains('drawer-overlay')) document.getElementById(id).classList.remove('open');
}
// 和 shopping.html / activity.html 里的必须一字不差，由 scripts/verify-shared-fns.py 盯着。
// 这里原来是个旧版本：不转义单引号，也没有 String() 兜底——改进当初只传播到了另外
// 两个页面。2026-08-04 补齐。
function escHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c])); }

// ── Boot ──
// 2026-11-02 起没有登录门了，直接起 app。
// paintChrome 必须在 initApp 之前：initApp 会触发 render()，
// 而 render 依赖的静态标签得先就位。
document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN';
paintChrome();
initApp();
</script>
</body>
</html>
